# fly.toml app configuration file generated for fileserver-northseo on 2026-06-25T18:58:20+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fileserver-northseo'
primary_region = 'nrt'

[build]

[env]
  ASPNETCORE_URLS = 'http://0.0.0.0:8080'
  DATA_DIR = '/data'
  PHOTOS_DIR = '/app/photos'

[[mounts]]
  source = 'fileserver_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
